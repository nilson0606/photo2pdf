<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo2PDF">
<meta name="theme-color" content="#1f6feb">
<meta name="description" content="把 iPhone 照片轉成 PDF：自動偵測文件四角或手動拖曳，透視校正，全部在裝置上處理。">
<title>Photo2PDF</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --fg:#1b2130; --muted:#667085; --line:#e2e5ea;
  --accent:#1f6feb; --accent-fg:#ffffff; --danger:#d93838; --shade:rgba(10,14,22,.55);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1216; --card:#1a1f26; --fg:#e7eaee; --muted:#98a2b3; --line:#2a313a;
    --accent:#4c8dff; --accent-fg:#0b1220; --danger:#ff6b6b; --shade:rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding-top:calc(8px + env(safe-area-inset-top))}
header h1{font-size:20px;margin:0;flex:1}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:2px dashed var(--line);border-radius:16px;padding:22px;margin:12px 0;background:var(--card);cursor:pointer;text-align:center}
.add.drag{border-color:var(--accent)}
.add strong{font-size:18px;color:var(--accent)}
.add span{font-size:13px;color:var(--muted)}
.add input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 140px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:3/4;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.thumb img{max-width:100%;max-height:100%;display:block;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.thumb .no{position:absolute;left:8px;top:8px;background:var(--shade);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.thumb .tag{position:absolute;right:8px;top:8px;background:var(--danger);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
.thumb .spin{font-size:13px;color:var(--muted)}
.tools{display:flex;justify-content:space-between;padding:4px}
.tools button{padding:6px 0;flex:1;border:none;background:transparent;font-size:17px;border-radius:8px}
.tools button:active{background:var(--line)}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bar select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--bg)}
.bar .go{margin-left:auto}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:-120px;margin-bottom:130px}
.foot a{color:var(--muted)}

/* 編輯器 */
#editor{position:fixed;inset:0;background:#0b0d10;color:#eef1f4;display:none;flex-direction:column;z-index:10}
#editor.show{display:flex}
#editor .top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
#editor .top .t{flex:1;text-align:center;font-size:15px;color:#b8c0ca}
#editor button{background:#20262e;border-color:#2e3640;color:#eef1f4}
#editor button.primary{background:#4c8dff;border-color:#4c8dff;color:#0b1220}
#stage{flex:1;position:relative;touch-action:none;overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#stage #loupe{position:absolute;inset:auto;top:12px;left:12px;width:128px;height:128px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 2px 12px rgba(0,0,0,.6);display:none;pointer-events:none}
#editor .bottom{padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#editor .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #2e3640;border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 12px;background:#20262e}
.seg button.on{background:#4c8dff;color:#0b1220;font-weight:600}
.hint{font-size:12px;color:#8a94a0;text-align:center}
.small{font-size:13px;padding:6px 10px}

/* 對話框 */
#dlg{position:fixed;inset:0;background:var(--shade);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#dlg.show{display:flex}
#dlg .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
#dlg h2{font-size:18px;margin:0}
#dlg .meta{font-size:13px;color:var(--muted)}
#dlg input{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);width:100%}
#dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222a33;color:#fff;font-size:14px;
  padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Photo2PDF</h1>
    <span id="cvStatus" class="status">載入影像引擎中…</span>
  </header>

  <label class="add" id="drop">
    <input id="file" type="file" accept="image/*,.heic,.heif" multiple>
    <strong>＋ 加入照片</strong>
    <span>可一次選多張；會自動偵測文件四角，點縮圖或 ✎ 可手動調整</span>
  </label>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">還沒有照片。照片只在你的裝置上處理，不會上傳。</div>
</div>
<p class="foot">開源（MIT）· 照片不離開你的裝置 · <a href="https://github.com/nilson0606/photo2pdf" id="repoLink" target="_blank" rel="noopener">GitHub</a></p>

<div class="bar"><div class="in">
  <label>頁面
    <select id="pageSize">
      <option value="fit">符合照片</option>
      <option value="a4">A4</option>
      <option value="letter">Letter</option>
    </select>
  </label>
  <label>畫質
    <select id="quality">
      <option value="std">標準</option>
      <option value="high">高</option>
    </select>
  </label>
  <label>新照片濾鏡
    <select id="defFilter">
      <option value="color">原色</option>
      <option value="gray">灰階</option>
      <option value="enhance">增強</option>
      <option value="bw">黑白</option>
    </select>
  </label>
  <button id="clearAll" class="ghost small">清空</button>
  <button id="make" class="primary go" disabled>產生 PDF</button>
</div></div>

<div id="editor">
  <div class="top">
    <button id="edCancel">取消</button>
    <div class="t" id="edTitle">第 1 頁</div>
    <button id="edDone" class="primary">完成</button>
  </div>
  <div id="stage"><canvas id="edCanvas"></canvas><canvas id="loupe" width="256" height="256"></canvas></div>
  <div class="bottom">
    <div class="hint">拖曳四個角對齊文件邊緣（按住時會出現放大鏡）</div>
    <div class="row">
      <button id="edAuto" class="small">自動偵測</button>
      <button id="edFull" class="small">整張照片</button>
    </div>
    <div class="row">
      <div class="seg" id="edFilter">
        <button data-f="color">原色</button><button data-f="gray">灰階</button><button data-f="enhance">增強</button><button data-f="bw">黑白</button>
      </div>
    </div>
    <div class="row"><button id="edFilterAll" class="small ghost">全部頁面改用這個濾鏡</button></div>
  </div>
</div>

<div id="dlg"><div class="box">
  <h2 id="dlgTitle">產生 PDF</h2>
  <div class="meta" id="dlgMeta"></div>
  <input id="fname" type="text" spellcheck="false">
  <div class="acts">
    <button id="dlgClose">關閉</button>
    <button id="dlgShare" style="display:none">分享</button>
    <button id="dlgSave" class="primary">下載</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
 * Photo2PDF — 照片轉 PDF（自動 / 手動框圖 + 透視校正）
 * 全部在瀏覽器端處理。MIT License.
 * ========================================================= */

const OPENCV_URLS = [
  'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js',
  'https://docs.opencv.org/4.10.0/opencv.js',
];
const HEIC2ANY_URL = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';

const PREVIEW_MAX = 1200;   // 編輯用預覽圖長邊
const DETECT_MAX = 640;     // 偵測用長邊
const QUALITY = {           // 輸出設定
  std:  { srcMax: 2400, outMax: 2000, jpeg: 0.82 },
  high: { srcMax: 3600, outMax: 3200, jpeg: 0.90 },
};
const FILTER_NAMES = { color: '原色', gray: '灰階', enhance: '增強', bw: '黑白' };

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pages = [];   // { id, src:Blob, preview:Blob, quad:[[x,y]...4] 正規化, rot, filter, thumbUrl, busy, noDoc }
let nextId = 1;

/* ---------------- 共用工具 ---------------- */
function toast(msg, ms = 2400) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.async = true; s.onload = res; s.onerror = () => rej(new Error('load ' + url));
    document.head.appendChild(s);
  });
}
async function loadImage(blob) {
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.src = url;
  try { await img.decode(); } catch (e) { URL.revokeObjectURL(url); throw e; }
  img._url = url;
  return img;
}
function freeImage(img) { if (img && img._url) URL.revokeObjectURL(img._url); }
function isHeic(file) { return /\.(heic|heif)$/i.test(file.name || '') || /hei[cf]/i.test(file.type || ''); }
async function heicToJpeg(file) {
  if (!window.heic2any) await loadScript(HEIC2ANY_URL);
  const out = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
  return Array.isArray(out) ? out[0] : out;
}
/** 解碼使用者的檔案；瀏覽器不支援 HEIC（例如 Windows Chrome）時自動轉 JPEG */
async function decodeFile(file) {
  try { return { blob: file, img: await loadImage(file) }; }
  catch (e) {
    if (!isHeic(file)) throw e;
    const jpg = await heicToJpeg(file);
    return { blob: jpg, img: await loadImage(jpg) };
  }
}
/** 把圖畫到一張長邊不超過 maxSide 的 canvas（避開 iPhone 的 canvas 尺寸上限） */
function drawScaled(img, maxSide) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const s = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function canvasToBlob(c, q) { return new Promise((r) => c.toBlob(r, 'image/jpeg', q)); }
function freeCanvas(c) { if (c) { c.width = 0; c.height = 0; } }
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function polyArea(p) {
  let a = 0;
  for (let i = 0; i < p.length; i++) { const j = (i + 1) % p.length; a += p[i][0] * p[j][1] - p[j][0] * p[i][1]; }
  return Math.abs(a) / 2;
}
/** 四點排序成 左上、右上、右下、左下 */
function orderQuad(pts) {
  const cx = pts.reduce((s, p) => s + p[0], 0) / 4, cy = pts.reduce((s, p) => s + p[1], 0) / 4;
  const sorted = pts.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  let k = 0;
  for (let i = 1; i < 4; i++) if (sorted[i][0] + sorted[i][1] < sorted[k][0] + sorted[k][1]) k = i;
  return [0, 1, 2, 3].map((i) => sorted[(k + i) % 4]);
}
const FULL_QUAD = () => [[0, 0], [1, 0], [1, 1], [0, 1]];

/* ---------------- OpenCV 載入 ---------------- */
let cv = null;
const cvReady = (async () => {
  let lastErr;
  for (const url of OPENCV_URLS) {
    try {
      await loadScript(url);
      let m = window.cv;
      if (m instanceof Promise) m = await m;
      const t0 = Date.now();
      while (!(m && m.Mat)) {
        if (Date.now() - t0 > 60000) throw new Error('OpenCV 初始化逾時');
        await sleep(50);
        if (window.cv && window.cv.Mat) m = window.cv;
      }
      cv = m;
      // 注意：OpenCV 模組本身帶有 .then()，不能直接 return 它，
      // 否則 Promise 會不斷展開而卡死主執行緒。
      return true;
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
})();
cvReady.then(() => {
  $('cvStatus').textContent = '就緒';
  setTimeout(() => { $('cvStatus').textContent = ''; }, 1500);
  refreshUI();
}).catch((e) => {
  console.error(e);
  const s = $('cvStatus'); s.textContent = '影像引擎載入失敗，請檢查網路後重新整理'; s.classList.add('err');
});

/* ---------------- 影像處理（OpenCV） ---------------- */
/**
 * 框邊支持度：沿四條邊取樣，比較「框內」與「框外」的亮度。
 * 真正的紙張邊緣整條都是一邊亮一邊暗（方向一致）；落在雜亂紋理上的假邊緣會忽亮忽暗。
 * 貼著照片邊框的邊（紙超出畫面）只給 0.5 分。
 * 回傳 [平均, 最低, 貼邊框的邊數]
 */
function edgeSupport(q, g, W, H) {
  const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
  const N = 40, DIFF = 12;
  let sum = 0, min = 1, borderEdges = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    let nx = -dy / L, ny = dx / L;
    if ((cx - (a[0] + b[0]) / 2) * nx + (cy - (a[1] + b[1]) / 2) * ny < 0) { nx = -nx; ny = -ny; }   // 法向量朝內
    let pos = 0, neg = 0, nb = 0;
    for (let k = 0; k < N; k++) {
      const t = 0.05 + 0.9 * k / (N - 1);
      const px = a[0] + dx * t, py = a[1] + dy * t;
      let si = 0, so = 0, cnt = 0, border = false;
      for (const d of [4, 8]) {
        const xo = Math.round(px - nx * d), yo = Math.round(py - ny * d);
        if (xo < 0 || yo < 0 || xo >= W || yo >= H) { border = true; break; }
        const xi = Math.round(px + nx * d), yi = Math.round(py + ny * d);
        if (xi >= 0 && yi >= 0 && xi < W && yi < H) { si += g[yi * W + xi]; so += g[yo * W + xo]; cnt++; }
      }
      if (border) { nb++; continue; }
      if (!cnt) continue;
      const diff = (si - so) / cnt;
      if (diff > DIFF) pos++; else if (diff < -DIFF) neg++;
    }
    let s;
    if (nb > N * 0.5) { s = 0.5; borderEdges++; }
    else s = (Math.max(pos, neg) + 0.5 * nb) / N;
    sum += s; min = Math.min(min, s);
  }
  return [sum / 4, min, borderEdges];
}
/**
 * 自動偵測文件四角；回傳正規化座標（0~1）或 null。
 * 作法：用多種遮罩產生候選四邊形，再用「面積 × 實心度² × 框邊支持度」評分挑最好的。
 *   - Canny 邊緣（兩組門檻）＋ 照片外框（讓超出畫面的紙也能封閉）
 *   - 亮度門檻（Otsu 及偏移）原版
 *   - 開運算：切斷紙張與背景之間的細小連接
 *   - 大閉運算：接回被細長物體（背帶、手指）切開的紙
 */
function detectQuad(canvas) {
  const mats = [];
  const M = (m) => (mats.push(m), m);
  try {
    const src = M(cv.imread(canvas));
    const s = Math.min(1, DETECT_MAX / Math.max(src.cols, src.rows));
    const small = M(new cv.Mat());
    cv.resize(src, small, new cv.Size(Math.round(src.cols * s), Math.round(src.rows * s)), 0, 0, cv.INTER_AREA);
    const W = small.cols, H = small.rows, imgArea = W * H;
    const gray = M(new cv.Mat());
    cv.cvtColor(small, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
    const g = gray.data;
    const k3 = M(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3)));
    const k5 = M(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5)));
    const big = Math.max(5, Math.floor(Math.min(W, H) * 0.035)) | 1;
    const kb = M(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(big, big)));
    const kb2 = M(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(2 * big + 1, 2 * big + 1)));
    const anchor = new cv.Point(-1, -1);

    const masks = [];
    for (const [lo, hi] of [[20, 60], [40, 120]]) {
      const e = M(new cv.Mat());
      cv.Canny(gray, e, lo, hi);
      cv.dilate(e, e, k3);
      cv.rectangle(e, new cv.Point(0, 0), new cv.Point(W - 1, H - 1), new cv.Scalar(255), 1);
      cv.morphologyEx(e, e, cv.MORPH_CLOSE, k5, anchor, 2);
      masks.push(e);
    }
    const tmp = M(new cv.Mat());
    const otsu = cv.threshold(gray, tmp, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
    for (const off of [0, 15, 30]) {
      const t = M(new cv.Mat());
      cv.threshold(gray, t, Math.min(250, otsu + off), 255, cv.THRESH_BINARY);
      cv.morphologyEx(t, t, cv.MORPH_CLOSE, k5, anchor, 2);
      const o = M(new cv.Mat()); cv.morphologyEx(t, o, cv.MORPH_OPEN, kb);
      const b = M(new cv.Mat()); cv.morphologyEx(t, b, cv.MORPH_CLOSE, kb2);
      masks.push(t, o, b);
    }

    let best = null, bestScore = 0;
    for (const mask of masks) {
      const contours = new cv.MatVector(), hier = new cv.Mat();
      cv.findContours(mask, contours, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
      for (let i = 0; i < contours.size(); i++) {
        const c = contours.get(i);
        const area = Math.abs(cv.contourArea(c));
        if (area < imgArea * 0.1) { c.delete(); continue; }
        const hull = new cv.Mat();
        cv.convexHull(c, hull, false, true);
        const peri = cv.arcLength(hull, true);
        let quad = null;
        for (const eps of [0.02, 0.03, 0.045, 0.06, 0.08, 0.1]) {
          const ap = new cv.Mat();
          cv.approxPolyDP(hull, ap, eps * peri, true);
          const n = ap.rows;
          if (n === 4) { quad = []; for (let k = 0; k < 4; k++) quad.push([ap.data32S[k * 2], ap.data32S[k * 2 + 1]]); }
          ap.delete();
          if (n <= 4) break;
        }
        hull.delete(); c.delete();
        if (!quad) continue;
        const qa = polyArea(quad);
        if (qa > imgArea * 0.97 || qa < imgArea * 0.1) continue;   // 幾乎整張照片 → 是照片外框
        const fill = Math.min(1, area / qa);                      // 框內有多少是實心的
        const [sup, mn, borderEdges] = edgeSupport(quad, g, W, H);
        if (borderEdges >= 3) continue;                           // 三邊以上貼著照片邊框 → 是背景
        const score = (qa / imgArea) * fill * fill * sup * (0.5 + 0.5 * mn);
        if (score > bestScore) { bestScore = score; best = quad; }
      }
      contours.delete(); hier.delete();
    }
    if (!best) return null;
    return orderQuad(best).map(([x, y]) => [Math.min(1, Math.max(0, x / (W - 1))), Math.min(1, Math.max(0, y / (H - 1)))]);
  } finally {
    mats.forEach((m) => m.delete());
  }
}
/** 依四角做透視校正，回傳 RGBA Mat（呼叫端負責 delete） */
function warpQuad(canvas, quadN, outMax) {
  const src = cv.imread(canvas);
  const W = src.cols, H = src.rows;
  const p = quadN.map(([x, y]) => [x * (W - 1), y * (H - 1)]);
  let ow = Math.max(dist(p[0], p[1]), dist(p[3], p[2]));
  let oh = Math.max(dist(p[0], p[3]), dist(p[1], p[2]));
  const s = Math.min(1, outMax / Math.max(ow, oh));
  ow = Math.max(8, Math.round(ow * s)); oh = Math.max(8, Math.round(oh * s));
  const sp = cv.matFromArray(4, 1, cv.CV_32FC2, p.flat());
  const dp = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, ow - 1, 0, ow - 1, oh - 1, 0, oh - 1]);
  const T = cv.getPerspectiveTransform(sp, dp);
  const dst = new cv.Mat();
  cv.warpPerspective(src, dst, T, new cv.Size(ow, oh), cv.INTER_LINEAR, cv.BORDER_REPLICATE, new cv.Scalar());
  src.delete(); sp.delete(); dp.delete(); T.delete();
  return dst;
}
/** 除以模糊背景 → 去陰影、背景變白 */
function flattenBg(m) {
  const f = Math.max(1, Math.max(m.cols, m.rows) / 400);
  const sm = new cv.Mat(), bg = new cv.Mat(), out = new cv.Mat();
  cv.resize(m, sm, new cv.Size(Math.max(1, Math.round(m.cols / f)), Math.max(1, Math.round(m.rows / f))), 0, 0, cv.INTER_AREA);
  const k = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(7, 7));
  cv.dilate(sm, sm, k);
  cv.medianBlur(sm, sm, 21);
  cv.resize(sm, bg, new cv.Size(m.cols, m.rows), 0, 0, cv.INTER_LINEAR);
  cv.divide(m, bg, out, 255);
  sm.delete(); bg.delete(); k.delete();
  return out;
}
/** 濾鏡：吃 RGBA Mat，回傳新的 Mat（會 delete 輸入） */
function applyFilter(rgba, mode) {
  if (mode === 'color' || !mode) return rgba;
  let out;
  if (mode === 'enhance') {
    const rgb = new cv.Mat(); cv.cvtColor(rgba, rgb, cv.COLOR_RGBA2RGB);
    out = flattenBg(rgb); rgb.delete();
  } else {
    const g = new cv.Mat(); cv.cvtColor(rgba, g, cv.COLOR_RGBA2GRAY);
    const n = flattenBg(g); g.delete();
    if (mode === 'bw') {
      out = new cv.Mat();
      let block = Math.round(Math.min(n.cols, n.rows) / 30) | 1;
      block = Math.max(15, block);
      cv.adaptiveThreshold(n, out, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, block, 12);
      n.delete();
    } else out = n;
  }
  rgba.delete();
  return out;
}
function rotateMat(m, rot) {
  if (!rot) return m;
  const code = { 90: cv.ROTATE_90_CLOCKWISE, 180: cv.ROTATE_180, 270: cv.ROTATE_90_COUNTERCLOCKWISE }[rot];
  const d = new cv.Mat(); cv.rotate(m, d, code); m.delete();
  return d;
}
/** 一頁完整流程：校正 → 濾鏡 → 旋轉 → 畫到 canvas */
function renderPage(srcCanvas, page, outMax) {
  let m = warpQuad(srcCanvas, page.quad, outMax);
  m = applyFilter(m, page.filter);
  m = rotateMat(m, page.rot);
  const c = document.createElement('canvas');
  cv.imshow(c, m);
  m.delete();
  return c;
}

/* ---------------- PDF 產生（自寫，無外部函式庫） ---------------- */
const latin1 = (s) => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
/** images: [{ bytes:Uint8Array(JPEG), w, h }]；mode: fit | a4 | letter */
function buildPdf(images, mode) {
  const chunks = []; let off = 0; const offsets = [];
  const push = (x) => { const b = typeof x === 'string' ? latin1(x) : x; chunks.push(b); off += b.length; };
  const f = (n) => (Math.round(n * 100) / 100).toString();
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n = images.length;
  const pageIds = images.map((_, i) => 3 + i * 3);
  offsets[1] = off; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = off; push(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${pageIds.map((id) => id + ' 0 R').join(' ')}] >>\nendobj\n`);
  images.forEach((im, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    let pw, ph;
    if (mode === 'fit') {
      const L = 841.89;   // 長邊與 A4 長邊一致
      if (im.w >= im.h) { pw = L; ph = L * im.h / im.w; } else { ph = L; pw = L * im.w / im.h; }
    } else {
      [pw, ph] = mode === 'letter' ? [612, 792] : [595.28, 841.89];
      if (im.w > im.h) [pw, ph] = [ph, pw];
    }
    const sc = Math.min(pw / im.w, ph / im.h);
    const dw = im.w * sc, dh = im.h * sc, x = (pw - dw) / 2, y = (ph - dh) / 2;
    const content = `q ${f(dw)} 0 0 ${f(dh)} ${f(x)} ${f(y)} cm /Im0 Do Q\n`;
    offsets[pid] = off;
    push(`${pid} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(pw)} ${f(ph)}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\nendobj\n`);
    offsets[cid] = off;
    push(`${cid} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);
    offsets[iid] = off;
    push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    push(im.bytes);
    push('\nendstream\nendobj\n');
  });
  const size = 3 + n * 3;
  const xref = off;
  let x = `xref\n0 ${size}\n0000000000 65535 f \n`;
  for (let id = 1; id < size; id++) x += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

/* ---------------- 匯入 ---------------- */
let importChain = Promise.resolve();
function addFiles(fileList) {
  const files = [...fileList].filter((f) => /^image\//.test(f.type) || isHeic(f));
  if (!files.length) { toast('沒有可用的圖片檔'); return; }
  for (const file of files) {
    const page = { id: nextId++, src: null, preview: null, quad: FULL_QUAD(), rot: 0,
      filter: $('defFilter').value, thumbUrl: null, busy: true, noDoc: false };
    pages.push(page);
    importChain = importChain.then(() => importOne(page, file));
  }
  refreshUI();
}
async function importOne(page, file) {
  let img = null, pc = null;
  try {
    const d = await decodeFile(file);
    img = d.img; page.src = d.blob;
    pc = drawScaled(img, PREVIEW_MAX);
    page.preview = await canvasToBlob(pc, 0.85);
    await cvReady;
    const q = detectQuad(pc);
    if (q) page.quad = q; else page.noDoc = true;
    await makeThumb(page, pc);
  } catch (e) {
    console.error(e);
    toast(`「${file.name}」無法讀取，已略過`);
    const i = pages.indexOf(page); if (i >= 0) pages.splice(i, 1);
  } finally {
    freeImage(img); freeCanvas(pc);
    page.busy = false;
    refreshUI();
  }
}
async function makeThumb(page, previewCanvas) {
  let own = false, img = null;
  if (!previewCanvas) { img = await loadImage(page.preview); previewCanvas = drawScaled(img, PREVIEW_MAX); own = true; }
  const c = renderPage(previewCanvas, page, 480);
  const b = await canvasToBlob(c, 0.8);
  freeCanvas(c);
  if (own) { freeCanvas(previewCanvas); freeImage(img); }
  if (page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
  page.thumbUrl = URL.createObjectURL(b);
}

/* ---------------- 列表畫面 ---------------- */
function refreshUI() {
  const grid = $('grid');
  grid.innerHTML = '';
  pages.forEach((p, i) => {
    const card = document.createElement('div'); card.className = 'card';
    const th = document.createElement('div'); th.className = 'thumb';
    if (p.busy || !p.thumbUrl) th.innerHTML = '<span class="spin">處理中…</span>';
    else { const im = new Image(); im.src = p.thumbUrl; im.alt = `第 ${i + 1} 頁`; th.appendChild(im); }
    th.insertAdjacentHTML('beforeend', `<span class="no">${i + 1}</span>`);
    if (p.noDoc && !p.busy) th.insertAdjacentHTML('beforeend', '<span class="tag">請手動框</span>');
    th.onclick = () => { if (!p.busy && cv) openEditor(p); };
    const tools = document.createElement('div'); tools.className = 'tools';
    const mk = (label, title, fn, dis) => { const b = document.createElement('button'); b.textContent = label; b.title = title; b.setAttribute('aria-label', title); b.disabled = !!dis; b.onclick = fn; tools.appendChild(b); };
    mk('✎', '調整框選', () => { if (!p.busy && cv) openEditor(p); }, p.busy || !cv);
    mk('↑', '往前移', () => move(i, -1), i === 0);
    mk('↓', '往後移', () => move(i, 1), i === pages.length - 1);
    mk('⟳', '順時針旋轉', () => rotate(p), p.busy || !cv);
    mk('✕', '刪除', () => removePage(i), p.busy);
    card.append(th, tools);
    grid.appendChild(card);
  });
  $('empty').style.display = pages.length ? 'none' : '';
  $('make').disabled = !cv || !pages.length || pages.some((p) => p.busy);
}
function move(i, d) { const j = i + d; if (j < 0 || j >= pages.length) return; [pages[i], pages[j]] = [pages[j], pages[i]]; refreshUI(); }
async function rotate(p) { p.rot = (p.rot + 90) % 360; p.busy = true; refreshUI(); await makeThumb(p); p.busy = false; refreshUI(); }
function removePage(i) { const [p] = pages.splice(i, 1); if (p.thumbUrl) URL.revokeObjectURL(p.thumbUrl); refreshUI(); }

/* ---------------- 編輯器（四角拖曳） ---------------- */
const ed = { page: null, img: null, quad: null, filter: 'color', drag: -1, grab: [0, 0], ptr: null, layout: null };
const edCanvas = $('edCanvas'), loupe = $('loupe');

async function openEditor(page) {
  ed.page = page;
  ed.quad = page.quad.map((p) => p.slice());
  ed.filter = page.filter;
  ed.img = await loadImage(page.preview);
  $('edTitle').textContent = `第 ${pages.indexOf(page) + 1} 頁`;
  setFilterButtons();
  $('editor').classList.add('show');
  document.body.style.overflow = 'hidden';
  resizeEditor();
  if (page.noDoc) toast('沒偵測到文件邊緣，請手動拖曳四個角');
}
function closeEditor() {
  $('editor').classList.remove('show');
  document.body.style.overflow = '';
  freeImage(ed.img); ed.img = null; ed.page = null;
}
function resizeEditor() {
  if (!ed.img) return;
  const r = $('stage').getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  edCanvas.width = Math.round(r.width * dpr); edCanvas.height = Math.round(r.height * dpr);
  const pad = 22;
  const iw = ed.img.naturalWidth, ih = ed.img.naturalHeight;
  const s = Math.min((r.width - pad * 2) / iw, (r.height - pad * 2) / ih);
  ed.layout = { s, dpr, w: iw * s, h: ih * s, ox: (r.width - iw * s) / 2, oy: (r.height - ih * s) / 2 };
  drawEditor();
}
const toScreen = ([x, y]) => [ed.layout.ox + x * ed.layout.w, ed.layout.oy + y * ed.layout.h];
const toNorm = ([x, y]) => [Math.min(1, Math.max(0, (x - ed.layout.ox) / ed.layout.w)), Math.min(1, Math.max(0, (y - ed.layout.oy) / ed.layout.h))];
function drawEditor() {
  const L = ed.layout; if (!L) return;
  const ctx = edCanvas.getContext('2d');
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.clearRect(0, 0, edCanvas.width, edCanvas.height);
  ctx.drawImage(ed.img, L.ox, L.oy, L.w, L.h);
  const pts = ed.quad.map(toScreen);
  // 框外變暗
  ctx.save();
  ctx.beginPath(); ctx.rect(L.ox, L.oy, L.w, L.h);
  ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 3; i >= 1; i--) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fill('evenodd');
  ctx.restore();
  ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#4c8dff'; ctx.stroke();
  pts.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p[0], p[1], ed.drag === i ? 15 : 12, 0, Math.PI * 2);
    ctx.fillStyle = ed.drag === i ? '#4c8dff' : 'rgba(255,255,255,.95)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#4c8dff'; ctx.stroke();
  });
  drawLoupe();
}
function drawLoupe() {
  if (ed.drag < 0) { loupe.style.display = 'none'; return; }
  const L = ed.layout;
  const [nx, ny] = ed.quad[ed.drag];
  const iw = ed.img.naturalWidth, ih = ed.img.naturalHeight;
  const zoom = 3;                                   // 相對螢幕顯示的放大倍數
  const srcR = (64 / (L.s * zoom));                 // 取樣半徑（原圖像素）
  const cx = nx * iw, cy = ny * ih;
  const c = loupe.getContext('2d');
  c.fillStyle = '#000'; c.fillRect(0, 0, 256, 256);
  c.drawImage(ed.img, cx - srcR, cy - srcR, srcR * 2, srcR * 2, 0, 0, 256, 256);
  // 框線
  const pts = ed.quad.map(([x, y]) => [((x * iw) - cx) / srcR * 128 + 128, ((y * ih) - cy) / srcR * 128 + 128]);
  c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath();
  c.lineWidth = 3; c.strokeStyle = '#4c8dff'; c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(128, 104); c.lineTo(128, 152); c.moveTo(104, 128); c.lineTo(152, 128); c.stroke();
  // 手指在左上時放到右上
  const sp = toScreen(ed.quad[ed.drag]);
  const stageW = $('stage').clientWidth;
  const leftSide = !(sp[0] < 170 && sp[1] < 170);
  loupe.style.left = leftSide ? '12px' : (stageW - 140) + 'px';
  loupe.style.top = '12px';
  loupe.style.display = 'block';
}
function stagePoint(e) { const r = edCanvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
edCanvas.addEventListener('pointerdown', (e) => {
  if (!ed.layout || ed.ptr !== null) return;
  const p = stagePoint(e);
  let k = -1, best = 48;
  ed.quad.map(toScreen).forEach((q, i) => { const d = dist(p, q); if (d < best) { best = d; k = i; } });
  if (k < 0) return;
  const q = toScreen(ed.quad[k]);
  ed.drag = k; ed.grab = [q[0] - p[0], q[1] - p[1]]; ed.ptr = e.pointerId;
  edCanvas.setPointerCapture(e.pointerId);
  drawEditor(); e.preventDefault();
});
edCanvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== ed.ptr || ed.drag < 0) return;
  const p = stagePoint(e);
  ed.quad[ed.drag] = toNorm([p[0] + ed.grab[0], p[1] + ed.grab[1]]);
  drawEditor(); e.preventDefault();
});
const endDrag = (e) => { if (e.pointerId !== ed.ptr) return; ed.drag = -1; ed.ptr = null; drawEditor(); };
edCanvas.addEventListener('pointerup', endDrag);
edCanvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', resizeEditor);

function setFilterButtons() { document.querySelectorAll('#edFilter button').forEach((b) => b.classList.toggle('on', b.dataset.f === ed.filter)); }
document.querySelectorAll('#edFilter button').forEach((b) => b.onclick = () => { ed.filter = b.dataset.f; setFilterButtons(); });
$('edFilterAll').onclick = async () => {
  const f = ed.filter;
  pages.forEach((p) => { if (p !== ed.page && p.filter !== f) { p.filter = f; p._dirty = true; } });
  toast(`全部頁面改為「${FILTER_NAMES[f]}」`);
};
$('edAuto').onclick = () => {
  const c = drawScaled(ed.img, PREVIEW_MAX);
  const q = detectQuad(c); freeCanvas(c);
  if (q) { ed.quad = q; drawEditor(); toast('已自動偵測'); }
  else toast('偵測不到文件邊緣，請手動拖曳');
};
$('edFull').onclick = () => { ed.quad = FULL_QUAD(); drawEditor(); };
$('edCancel').onclick = closeEditor;
$('edDone').onclick = async () => {
  const p = ed.page;
  const area = polyArea(ed.quad);
  if (area < 0.01) { toast('框選範圍太小'); return; }
  p.quad = orderQuad(ed.quad); p.filter = ed.filter; p.noDoc = false;
  closeEditor();
  const dirty = pages.filter((x) => x === p || x._dirty);
  dirty.forEach((x) => { x.busy = true; x._dirty = false; });
  refreshUI();
  for (const x of dirty) { try { await makeThumb(x); } catch (e) { console.error(e); } x.busy = false; refreshUI(); }
};

/* ---------------- 產生 PDF ---------------- */
let lastPdf = null;
function defaultName() {
  const d = new Date(), z = (n) => String(n).padStart(2, '0');
  return `photo2pdf-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.pdf`;
}
$('make').onclick = async () => {
  if (!pages.length) return;
  const Q = QUALITY[$('quality').value];
  const btn = $('make'); btn.disabled = true;
  const images = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      btn.textContent = `處理中 ${i + 1}/${pages.length}`;
      await sleep(0);
      const p = pages[i];
      const img = await loadImage(p.src);
      const sc = drawScaled(img, Q.srcMax);
      freeImage(img);
      const c = renderPage(sc, p, Q.outMax);
      freeCanvas(sc);
      const b = await canvasToBlob(c, Q.jpeg);
      images.push({ bytes: new Uint8Array(await b.arrayBuffer()), w: c.width, h: c.height });
      freeCanvas(c);
    }
    lastPdf = buildPdf(images, $('pageSize').value);
    $('fname').value = defaultName();
    $('dlgMeta').textContent = `${pages.length} 頁 · ${(lastPdf.size / 1048576).toFixed(1)} MB`;
    const f = new File([lastPdf], 'x.pdf', { type: 'application/pdf' });
    $('dlgShare').style.display = (navigator.canShare && navigator.canShare({ files: [f] })) ? '' : 'none';
    $('dlg').classList.add('show');
  } catch (e) {
    console.error(e);
    toast('產生失敗：' + (e && e.message ? e.message : e), 4000);
  } finally {
    btn.textContent = '產生 PDF';
    refreshUI();
  }
};
function pdfName() { let n = $('fname').value.trim() || defaultName(); if (!/\.pdf$/i.test(n)) n += '.pdf'; return n; }
$('dlgSave').onclick = () => {
  const url = URL.createObjectURL(lastPdf);
  const a = document.createElement('a'); a.href = url; a.download = pdfName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
};
$('dlgShare').onclick = async () => {
  try { await navigator.share({ files: [new File([lastPdf], pdfName(), { type: 'application/pdf' })] }); }
  catch (e) { if (e.name !== 'AbortError') toast('分享失敗'); }
};
$('dlgClose').onclick = () => $('dlg').classList.remove('show');

/* ---------------- 其他事件 ---------------- */
$('file').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
const drop = $('drop');
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
$('clearAll').onclick = () => {
  if (!pages.length || pages.some((p) => p.busy)) return;
  if (!confirm('確定清空所有頁面？')) return;
  pages.splice(0).forEach((p) => p.thumbUrl && URL.revokeObjectURL(p.thumbUrl));
  refreshUI();
};
// 測試用掛勾
window.Photo2PDF = { pages, buildPdf, detectQuad, orderQuad, cvReady };
refreshUI();
</script>
</body>
</html>
