<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo2Media">
<meta name="theme-color" content="#1f6feb">
<meta name="description" content="把 iPhone 照片轉成 PDF、照片或影片：自動偵測文件四角或手動拖曳，透視校正，全部在裝置上處理。">
<title>Photo2Media</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --fg:#1b2130; --muted:#667085; --line:#e2e5ea;
  --accent:#1f6feb; --accent-fg:#ffffff; --danger:#d93838; --shade:rgba(10,14,22,.55);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1216; --card:#1a1f26; --fg:#e7eaee; --muted:#98a2b3; --line:#2a313a;
    --accent:#4c8dff; --accent-fg:#0b1220; --danger:#ff6b6b; --shade:rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding-top:calc(8px + env(safe-area-inset-top))}
header h1{font-size:20px;margin:0;flex:1}
header h1 .ver{font-size:12px;font-weight:500;color:var(--muted);vertical-align:middle;margin-left:4px}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:2px dashed var(--line);border-radius:16px;padding:22px;margin:12px 0;background:var(--card);cursor:pointer;text-align:center}
.add.drag{border-color:var(--accent)}
.add strong{font-size:18px;color:var(--accent)}
.add span{font-size:13px;color:var(--muted)}
.add input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 170px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:3/4;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.thumb img{max-width:100%;max-height:100%;display:block;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:scale(1.06) rotate(-1.5deg);
  box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .12s}
.thumb .no{position:absolute;left:8px;top:8px;background:var(--shade);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.thumb .tag{position:absolute;right:8px;top:8px;background:var(--danger);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
.thumb .spin{font-size:13px;color:var(--muted)}
.tools{display:flex;justify-content:space-between;padding:4px}
.tools button{padding:6px 0;flex:1;border:none;background:transparent;font-size:17px;border-radius:8px}
.tools button:active{background:var(--line)}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
.gridbar{display:none;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.gridbar.show{display:flex}
.gridbar span{font-size:13px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .opts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bar .acts2{display:flex;gap:8px;align-items:center}
.bar .acts2 button:not(.ghost){flex:1;padding:9px 6px;white-space:nowrap}
.bar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bar select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--bg)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:-150px;margin-bottom:160px}
.foot a{color:var(--muted)}

/* 編輯器 */
#editor{position:fixed;inset:0;background:#0b0d10;color:#eef1f4;display:none;flex-direction:column;z-index:10}
#editor.show{display:flex}
#editor .top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
#editor .top .t{flex:1;text-align:center;font-size:15px;color:#b8c0ca}
#editor button{background:#20262e;border-color:#2e3640;color:#eef1f4}
#editor button.primary{background:#4c8dff;border-color:#4c8dff;color:#0b1220}
#stage{flex:1;position:relative;touch-action:none;overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#stage #loupe{position:absolute;inset:auto;top:12px;left:12px;width:128px;height:128px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 2px 12px rgba(0,0,0,.6);display:none;pointer-events:none}
#editor .bottom{padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#editor .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #2e3640;border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 12px;background:#20262e}
.seg button.on{background:#4c8dff;color:#0b1220;font-weight:600}
.hint{font-size:12px;color:#8a94a0;text-align:center}
.small{font-size:13px;padding:6px 10px}

/* 對話框 */
.modal{position:fixed;inset:0;background:var(--shade);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;
  max-height:calc(100vh - 32px);overflow:auto}
.modal h2{font-size:18px;margin:0}
.modal .meta{font-size:13px;color:var(--muted)}
.modal input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);width:100%}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#dlgVideo{display:none;width:100%;max-height:42vh;border-radius:10px;background:#000}
.vform{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.vform label.wide{grid-column:1 / -1}
.vform select{border:1px solid var(--line);border-radius:8px;padding:7px 6px;background:var(--bg);width:100%}
.vform input[type=range]{width:100%;accent-color:var(--accent)}
.vform output{color:var(--fg);font-weight:600}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(175px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222a33;color:#fff;font-size:14px;
  padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Photo2Media <span class="ver" id="verTop"></span></h1>
    <span id="cvStatus" class="status">載入影像引擎中…</span>
  </header>

  <label class="add" id="drop">
    <input id="file" type="file" accept="image/*,.heic,.heif" multiple>
    <strong>＋ 加入照片</strong>
    <span>可一次選多張；會自動偵測文件四角，點縮圖或 ✎ 可手動調整，長按縮圖可拖曳排序</span>
  </label>

  <div id="gridbar" class="gridbar">
    <span id="count"></span>
    <button id="autoAll" class="small">全部自動框選</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">還沒有照片。照片只在你的裝置上處理，不會上傳。</div>
</div>
<p class="foot"><span id="verFoot"></span> · 開源（MIT）· 照片不離開你的裝置 · <a href="https://github.com/nilson0606/photo2media" id="repoLink" target="_blank" rel="noopener">GitHub</a></p>

<div class="bar"><div class="in">
  <div class="opts">
  <label>頁面
    <select id="pageSize">
      <option value="fit">符合照片</option>
      <option value="a4">A4</option>
      <option value="letter">Letter</option>
    </select>
  </label>
  <label>畫質
    <select id="quality">
      <option value="std">標準</option>
      <option value="high">高</option>
    </select>
  </label>
  <label>新照片濾鏡
    <select id="defFilter">
      <option value="color">原色</option>
      <option value="gray">灰階</option>
      <option value="enhance">增強</option>
      <option value="bw">黑白</option>
    </select>
  </label>
  </div>
  <div class="acts2">
    <button id="clearAll" class="ghost small">清空</button>
    <button id="makeImg" disabled>存成照片</button>
    <button id="makeVid" disabled>做成影片</button>
    <button id="make" class="primary" disabled>產生 PDF</button>
  </div>
</div></div>

<div id="editor">
  <div class="top">
    <button id="edCancel">取消</button>
    <div class="t" id="edTitle">第 1 頁</div>
    <button id="edDone" class="primary">完成</button>
  </div>
  <div id="stage"><canvas id="edCanvas"></canvas><canvas id="loupe" width="256" height="256"></canvas></div>
  <div class="bottom">
    <div class="hint">拖曳四個角對齊文件邊緣（按住時會出現放大鏡）</div>
    <div class="row">
      <button id="edAuto" class="small">自動偵測</button>
      <button id="edFull" class="small">整張照片</button>
    </div>
    <div class="row">
      <div class="seg" id="edFilter">
        <button data-f="color">原色</button><button data-f="gray">灰階</button><button data-f="enhance">增強</button><button data-f="bw">黑白</button>
      </div>
    </div>
    <div class="row"><button id="edFilterAll" class="small ghost">全部頁面改用這個濾鏡</button></div>
  </div>
</div>

<div id="dlg" class="modal"><div class="box">
  <h2 id="dlgTitle">產生 PDF</h2>
  <video id="dlgVideo" playsinline controls muted></video>
  <div class="meta" id="dlgMeta"></div>
  <label class="meta" for="fname" id="fnameLabel">檔名</label>
  <input id="fname" type="text" spellcheck="false">
  <div class="meta" id="dlgHint"></div>
  <div class="acts">
    <button id="dlgClose">關閉</button>
    <button id="dlgShare" style="display:none">分享</button>
    <button id="dlgSave" class="primary">下載</button>
  </div>
</div></div>
<div id="vdlg" class="modal"><div class="box">
  <h2>做成影片</h2>
  <div class="vform">
    <label>畫面比例
      <select id="vAspect"><option value="9:16">直式 9:16</option><option value="16:9">橫式 16:9</option><option value="1:1">方形 1:1</option></select>
    </label>
    <label>內容
      <select id="vSource"><option value="page">框選後的頁面</option><option value="orig">原始整張照片</option></select>
    </label>
    <label class="wide">每張秒數：<output id="vDurOut"></output>
      <input id="vDur" type="range" min="1" max="10" step="0.5">
    </label>
    <label>轉場方式
      <select id="vTransMode"><option value="fixed">固定</option><option value="cycle">輪流</option><option value="random">隨機</option></select>
    </label>
    <label>轉場效果
      <select id="vTrans">
        <option value="cross">交叉淡入淡出</option><option value="black">黑場淡入淡出</option><option value="white">白場閃白</option>
        <option value="pushL">左右推移</option><option value="pushU">上下推移</option><option value="cover">滑入覆蓋</option>
        <option value="zoomIn">放大淡入</option><option value="circle">圓形展開</option><option value="wipe">由左擦入</option>
        <option value="blinds">百葉窗</option><option value="none">無轉場</option>
      </select>
    </label>
    <label class="wide">轉場秒數：<output id="vTrOut"></output>
      <input id="vTr" type="range" min="0.2" max="2" step="0.1">
    </label>
    <label>動態效果
      <select id="vMotion"><option value="zoom">緩慢放大</option><option value="none">關閉</option></select>
    </label>
    <label>影片濾鏡
      <select id="vFilter"><option value="none">原色</option><option value="gray">黑白</option><option value="sepia">懷舊</option><option value="warm">暖色</option><option value="cool">冷色</option><option value="vivid">鮮豔</option></select>
    </label>
    <label class="wide">空白處背景
      <select id="vBg"><option value="blur">模糊照片</option><option value="black">黑色</option><option value="white">白色</option></select>
    </label>
  </div>
  <div class="meta" id="vTransHint"></div>
  <div class="meta" id="vInfo"></div>
  <div class="progress" id="vProg"><i></i></div>
  <div class="acts">
    <button id="vReset" class="ghost small">恢復預設</button>
    <button id="vCancel">取消</button>
    <button id="vGo" class="primary">開始製作</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
 * Photo2Media — 照片轉 PDF / 照片 / 影片（自動 / 手動框圖 + 透視校正）
 * 全部在瀏覽器端處理。MIT License.
 * ========================================================= */

const APP_VERSION = '1.7.0';   // 改版時更新，並在 README 的「版本紀錄」補一行

const OPENCV_URLS = [
  'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js',
  'https://docs.opencv.org/4.10.0/opencv.js',
];
const HEIC2ANY_URL = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';

const PREVIEW_MAX = 1200;   // 編輯用預覽圖長邊
const DETECT_MAX = 640;     // 偵測用長邊
const QUALITY = {           // 輸出設定
  std:  { srcMax: 2400, outMax: 2000, jpeg: 0.82 },
  high: { srcMax: 3600, outMax: 3200, jpeg: 0.90 },
};
const FILTER_NAMES = { color: '原色', gray: '灰階', enhance: '增強', bw: '黑白' };

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pages = [];   // { id, src:Blob, preview:Blob, quad:[[x,y]...4] 正規化, rot, filter, thumbUrl, busy, noDoc }
let nextId = 1;

/* ---------------- 共用工具 ---------------- */
function toast(msg, ms = 2400) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.async = true; s.onload = res; s.onerror = () => rej(new Error('load ' + url));
    document.head.appendChild(s);
  });
}
async function loadImage(blob) {
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.src = url;
  try { await img.decode(); } catch (e) { URL.revokeObjectURL(url); throw e; }
  img._url = url;
  return img;
}
function freeImage(img) { if (img && img._url) URL.revokeObjectURL(img._url); }
function isHeic(file) { return /\.(heic|heif)$/i.test(file.name || '') || /hei[cf]/i.test(file.type || ''); }
async function heicToJpeg(file) {
  if (!window.heic2any) await loadScript(HEIC2ANY_URL);
  const out = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
  return Array.isArray(out) ? out[0] : out;
}
/** 解碼使用者的檔案；瀏覽器不支援 HEIC（例如 Windows Chrome）時自動轉 JPEG */
async function decodeFile(file) {
  try { return { blob: file, img: await loadImage(file) }; }
  catch (e) {
    if (!isHeic(file)) throw e;
    const jpg = await heicToJpeg(file);
    return { blob: jpg, img: await loadImage(jpg) };
  }
}
/** 把圖畫到一張長邊不超過 maxSide 的 canvas（避開 iPhone 的 canvas 尺寸上限） */
function drawScaled(img, maxSide) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const s = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function canvasToBlob(c, q) { return new Promise((r) => c.toBlob(r, 'image/jpeg', q)); }
function freeCanvas(c) { if (c) { c.width = 0; c.height = 0; } }
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function polyArea(p) {
  let a = 0;
  for (let i = 0; i < p.length; i++) { const j = (i + 1) % p.length; a += p[i][0] * p[j][1] - p[j][0] * p[i][1]; }
  return Math.abs(a) / 2;
}
/** 四點排序成 左上、右上、右下、左下 */
function orderQuad(pts) {
  const cx = pts.reduce((s, p) => s + p[0], 0) / 4, cy = pts.reduce((s, p) => s + p[1], 0) / 4;
  const sorted = pts.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  let k = 0;
  for (let i = 1; i < 4; i++) if (sorted[i][0] + sorted[i][1] < sorted[k][0] + sorted[k][1]) k = i;
  return [0, 1, 2, 3].map((i) => sorted[(k + i) % 4]);
}
const FULL_QUAD = () => [[0, 0], [1, 0], [1, 1], [0, 1]];

/* ---------------- OpenCV 載入 ---------------- */
let cv = null;
const cvReady = (async () => {
  let lastErr;
  for (const url of OPENCV_URLS) {
    try {
      await loadScript(url);
      let m = window.cv;
      if (m instanceof Promise) m = await m;
      const t0 = Date.now();
      while (!(m && m.Mat)) {
        if (Date.now() - t0 > 60000) throw new Error('OpenCV 初始化逾時');
        await sleep(50);
        if (window.cv && window.cv.Mat) m = window.cv;
      }
      cv = m;
      // 注意：OpenCV 模組本身帶有 .then()，不能直接 return 它，
      // 否則 Promise 會不斷展開而卡死主執行緒。
      return true;
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
})();
cvReady.then(() => {
  $('cvStatus').textContent = '就緒';
  setTimeout(() => { $('cvStatus').textContent = ''; }, 1500);
  refreshUI();
}).catch((e) => {
  console.error(e);
  const s = $('cvStatus'); s.textContent = '影像引擎載入失敗，請檢查網路後重新整理'; s.classList.add('err');
});

/* ---------------- 影像處理（OpenCV） ---------------- */
/**
 * 框邊支持度：沿四條邊取樣，比較「框內」與「框外」的亮度。
 * 真正的紙張邊緣整條都是「框內（紙）比框外亮」；落在雜亂紋理上的假邊緣會忽亮忽暗。
 * 只接受框內較亮：否則一整塊文字區（內暗外亮）會被誤認成紙，已框好的照片重新匯入時會被再切一次。
 * 貼著照片邊框的邊（紙超出畫面）只給 0.5 分。
 * 回傳 [平均, 最低, 貼邊框的邊數]
 */
function edgeSupport(q, g, W, H) {
  const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
  const N = 40, DIFF = 12;
  let sum = 0, min = 1, borderEdges = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    let nx = -dy / L, ny = dx / L;

/** 依四角做透視校正，回傳 RGBA Mat（呼叫端負責 delete） */

/* ---------------- PDF 產生（自寫，無外部函式庫） ---------------- */
const latin1 = (s) => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
/** images: [{ bytes:Uint8Array(JPEG), w, h }]；mode: fit | a4 | letter */
function buildPdf(images, mode) {
  const chunks = []; let off = 0; const offsets = [];
  const push = (x) => { const b = typeof x === 'string' ? latin1(x) : x; chunks.push(b); off += b.length; };
  const f = (n) => (Math.round(n * 100) / 100).toString();
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n = images.length;
  const pageIds = images.map((_, i) => 3 + i * 3);
  offsets[1] = off; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = off; push(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${pageIds.map((id) => id + ' 0 R').join(' ')}] >>\nendobj\n`);
  images.forEach((im, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    let pw, ph;
    if (mode === 'fit') {
      const L = 841.89;   // 長邊與 A4 長邊一致
      if (im.w >= im.h) { pw = L; ph = L * im.h / im.w; } else { ph = L; pw = L * im.w / im.h; }
    } else {
      [pw, ph] = mode === 'letter' ? [612, 792] : [595.28, 841.89];
      if (im.w > im.h) [pw, ph] = [ph, pw];
    }
    const sc = Math.min(pw / im.w, ph / im.h);
    const dw = im.w * sc, dh = im.h * sc, x = (pw - dw) / 2, y = (ph - dh) / 2;
    const content = `q ${f(dw)} 0 0 ${f(dh)} ${f(x)} ${f(y)} cm /Im0 Do Q\n`;
    offsets[pid] = off;
    push(`${pid} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(pw)} ${f(ph)}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\nendobj\n`);
    offsets[cid] = off;
    push(`${cid} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);
    offsets[iid] = off;
    push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    push(im.bytes);
    push('\nendstream\nendobj\n');

  let x = `xref\n0 ${size}\n0000000000 65535 f \n`;
  for (let id = 1; id < size; id++) x += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

}

/* ---------------- 匯入 ---------------- */
let importChain = Promise.resolve();
function addFiles(fileList) {
  const files = [...fileList].filter((f) => /^image\//.test(f.type) || isHeic(f));
  if (!files.length) { toast('沒有可用的圖片檔'); return; }
  for (const file of files) {
    const page = { id: nextId++, src: null, preview: null, quad: FULL_QUAD(), rot: 0,
      filter: $('defFilter').value, thumbUrl: null, busy: true, noDoc: false };
    pages.push(page);
    importChain = importChain.then(() => importOne(page, file));
  }
  refreshUI();
}
async function importOne(page, file) {
  let img = null, pc = null;
  try {
    const d = await decodeFile(file);
    img = d.img; page.src = d.blob;
    pc = drawScaled(img, PREVIEW_MAX);
    page.preview = await canvasToBlob(pc, 0.85);
    await cvReady;
    const q = detectQuad(pc);
    if (q) page.quad = q; else page.noDoc = true;
    await makeThumb(page, pc);
  } catch (e) {
    console.error(e);
    toast(`「${file.name}」無法讀取，已略過`);
    const i = pages.indexOf(page); if (i >= 0) pages.splice(i, 1);
  } finally {
    freeImage(img); freeCanvas(pc);
    page.busy = false;
    refreshUI();
  }
}
async function makeThumb(page, previewCanvas) {
  let own = false, img = null;
  if (!previewCanvas) { img = await loadImage(page.preview); previewCanvas = drawScaled(img, PREVIEW_MAX); own = true; }
  const c = renderPage(previewCanvas, page, 480);
  const b = await canvasToBlob(c, 0.8);
  freeCanvas(c);
  if (own) { freeCanvas(previewCanvas); freeImage(img); }
  if (page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
  page.thumbUrl = URL.createObjectURL(b);
}

/* ---------------- 列表畫面 ---------------- */
function refreshUI() {
  const grid = $('grid');
  grid.innerHTML = '';
  pages.forEach((p, i) => {
    const card = document.createElement('div'); card.className = 'card'; card.dataset.id = p.id;
    const th = document.createElement('div'); th.className = 'thumb';
    if (p.busy || !p.thumbUrl) th.innerHTML = '<span class="spin">處理中…</span>';
    else { const im = new Image(); im.src = p.thumbUrl; im.alt = `第 ${i + 1} 頁`; th.appendChild(im); }
    th.insertAdjacentHTML('beforeend', `<span class="no">${i + 1}</span>`);
    if (p.noDoc && !p.busy) th.insertAdjacentHTML('beforeend', '<span class="tag">請手動框</span>');
    th.onclick = () => { if (!p.busy && cv) openEditor(p); };
    const tools = document.createElement('div'); tools.className = 'tools';
    const mk = (label, title, fn, dis) => { const b = document.createElement('button'); b.textContent = label; b.title = title; b.setAttribute('aria-label', title); b.disabled = !!dis; b.onclick = fn; tools.appendChild(b); };
    mk('✎', '調整框選', () => { if (!p.busy && cv) openEditor(p); }, p.busy || !cv);
    mk('↑', '往前移', () => move(i, -1), i === 0);
    mk('↓', '往後移', () => move(i, 1), i === pages.length - 1);
    mk('⟳', '順時針旋轉', () => rotate(p), p.busy || !cv);
    mk('✕', '刪除', () => removePage(i), p.busy);
    card.append(th, tools);
    grid.appendChild(card);
  });
  $('empty').style.display = pages.length ? 'none' : '';
  $('gridbar').classList.toggle('show', pages.length > 0);
  const nd = pages.filter((p) => p.noDoc && !p.busy).length;
  $('count').textContent = `共 ${pages.length} 張` + (nd ? ` · ${nd} 張需要手動框` : '');
  if (!autoAllBusy) $('autoAll').disabled = !cv || pages.some((p) => p.busy) || videoBusy;
  $('make').disabled = $('makeImg').disabled = $('makeVid').disabled = !cv || !pages.length || pages.some((p) => p.busy) || videoBusy;
}
/* ---------------- 全部自動框選 ---------------- */
let autoAllBusy = false;
$('autoAll').onclick = async () => {
  if (autoAllBusy || !cv || !pages.length) return;
  let targets = pages.filter((p) => !p.busy);
  const manual = targets.filter((p) => p.manual).length;
  if (manual && !confirm(`有 ${manual} 張是你手動調整過的。\n\n確定：全部重新自動框選（手動調整會被取代）\n取消：只框沒手動調整過的，保留你的調整`)) {
    targets = targets.filter((p) => !p.manual);
  }
  if (!targets.length) { toast('沒有需要重新框選的照片'); return; }
  const btn = $('autoAll');
  autoAllBusy = true; btn.disabled = true;
  targets.forEach((p) => { p.busy = true; });
  refreshUI();
  let ok = 0, fail = 0;
  for (let k = 0; k < targets.length; k++) {
    const p = targets[k];
    btn.textContent = `框選中 ${k + 1}/${targets.length}`;
    await sleep(0);
    let img = null, c = null;
    try {
      img = await loadImage(p.preview);
      c = drawScaled(img, PREVIEW_MAX);
      const q = detectQuad(c);
      if (q) { p.quad = q; p.noDoc = false; p.manual = false; ok++; }
      else { fail++; if (!p.manual) p.noDoc = true; }   // 偵測不到：保留原本的框
      await makeThumb(p, c);
    } catch (e) { console.error(e); fail++; }
    finally { freeImage(img); freeCanvas(c); p.busy = false; refreshUI(); }
  }
  autoAllBusy = false; btn.textContent = '全部自動框選';
  refreshUI();
  toast(fail ? `已框選 ${ok} 張；${fail} 張偵測不到，保留原本的框` : `已重新框選 ${ok} 張`, 3000);
};

/* ---------------- 拖曳排序：手機長按、電腦直接拖 ---------------- */
const drag = { card: null, ghost: null, timer: 0, active: false, sx: 0, sy: 0, ox: 0, oy: 0, x: 0, y: 0, raf: 0, ptr: null, suppressClick: false };
const LONG_PRESS = 350;
function dragPrepare(target, x, y) {
  if (drag.active || drag.card) return false;
  const card = target.closest && target.closest('#grid .card');
  if (!card || target.closest('.tools')) return false;
  const p = pages.find((q) => String(q.id) === card.dataset.id);
  if (!p || p.busy || videoBusy) return false;
  drag.card = card; drag.sx = x; drag.sy = y;

  const card = drag.card, r = card.getBoundingClientRect();
  drag.active = true; clearTimeout(drag.timer);
  drag.ox = drag.sx - r.left; drag.oy = drag.sy - r.top; drag.x = drag.sx; drag.y = drag.sy;
  const g = card.cloneNode(true);
  g.classList.add('drag-ghost'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  document.body.appendChild(g); drag.ghost = g;
  card.classList.add('dragging');
  const loop = () => {   // 靠近上下邊緣時自動捲動
    if (!drag.active) return;
    const barTop = document.querySelector('.bar').getBoundingClientRect().top;
    let dy = 0;
    if (drag.y < 70) dy = -Math.ceil((70 - drag.y) / 6);
    else if (drag.y > barTop - 50) dy = Math.ceil((drag.y - barTop + 50) / 6);
    if (dy) { window.scrollBy(0, dy); dragMove(drag.x, drag.y); }
    drag.raf = requestAnimationFrame(loop);
  };

}
function dragMove(x, y) {

  drag.ghost.style.left = (x - drag.ox) + 'px'; drag.ghost.style.top = (y - drag.oy) + 'px';
  const grid = $('grid');
  const el = document.elementFromPoint(x, y);
  const over = el && el.closest && el.closest('#grid .card');
  if (!over || over === drag.card) return;
  const cards = [...grid.children];
  if (cards.indexOf(over) < cards.indexOf(drag.card)) grid.insertBefore(drag.card, over);
  else grid.insertBefore(drag.card, over.nextSibling);
  [...grid.children].forEach((c, i) => { const no = c.querySelector('.no'); if (no) no.textContent = i + 1; });

}

  white:  (ctx, W, H, a, cur, next) => fadeThrough(ctx, W, H, a, cur, next, '255,255,255'),
  pushL:  (ctx, W, H, a, cur, next) => { cur({ dx: -a * W }); next({ dx: (1 - a) * W }); },
  pushU:  (ctx, W, H, a, cur, next) => { cur({ dy: -a * H }); next({ dy: (1 - a) * H }); },
  cover:  (ctx, W, H, a, cur, next) => {
    cur({});
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#000'; ctx.fillRect((1 - a) * W, 0, W, H); ctx.restore();
    next({ dx: (1 - a) * W });
  },
  zoomIn: (ctx, W, H, a, cur, next) => { cur({}); next({ alpha: a, scale: 1 + 0.18 * (1 - a) }); },
  circle: (ctx, W, H, a, cur, next) => {
    cur({});
    ctx.save(); ctx.beginPath(); ctx.arc(W / 2, H / 2, a * Math.hypot(W, H) / 2, 0, Math.PI * 2); ctx.clip();
    next({}); ctx.restore();
  },
  wipe:   (ctx, W, H, a, cur, next) => {
    cur({});
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, a * W, H); ctx.clip(); next({}); ctx.restore();
  },
  blinds: (ctx, W, H, a, cur, next) => {
    cur({});
    const N = 8, h = H / N;
    ctx.save(); ctx.beginPath();
    for (let k = 0; k < N; k++) ctx.rect(0, k * h, W, h * a + 0.5);
    ctx.clip(); next({}); ctx.restore();
  },
};
const RANDOM_POOL = ['cross', 'black', 'white', 'pushL', 'pushU', 'cover', 'zoomIn', 'circle', 'wipe', 'blinds'];
function fadeThrough(ctx, W, H, a, cur, next, rgb) {
  if (a < 0.5) { cur({}); ctx.fillStyle = `rgba(${rgb},${a * 2})`; }
  else { next({}); ctx.fillStyle = `rgba(${rgb},${(1 - a) * 2})`; }
  ctx.fillRect(0, 0, W, H);
}
/**
 * 第 i 張 → 第 i+1 張用哪一種轉場
 *   固定：每次都用使用者選的那一種
 *   輪流：照 RANDOM_POOL 的順序一種換一種
 *   隨機：用換張序號算雜湊挑選（同一支影片每格一致），且不連續重複
 */
function pickTransition(v, i) {
  if (v.transMode === 'cycle') return RANDOM_POOL[i % RANDOM_POOL.length];
  if (v.transMode !== 'random') return v.trans;
  let prev = null, pick = null;
  for (let k = 0; k <= i; k++) {
    let h = Math.imul(k + 1, 0x9E3779B1) ^ 0x5bd1e995;
    h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13;
    let idx = (h >>> 0) % RANDOM_POOL.length;
    if (RANDOM_POOL[idx] === prev) idx = (idx + 1) % RANDOM_POOL.length;
    pick = RANDOM_POOL[idx]; prev = pick;
  }
  return pick;
}
/** 依時間畫出一格：處理轉場、緩慢放大、頭尾淡入淡出 */
function makeTimeline(v, n, W, H) {
  const D = v.dur;
  const T = (v.transMode === 'fixed' && v.trans === 'none') ? 0 : Math.min(v.tr, D * 0.8);
  const total = n * D;
  const cache = new Map();
  const get = (i) => {
    if (!cache.has(i)) cache.set(i, buildSlide(pages[i], v, W, H));
    return cache.get(i);
  };
  const smooth = (a) => { a = Math.min(1, Math.max(0, a)); return a * a * (3 - 2 * a); };
  const drawSlide = (ctx, sl, i, t, o) => {
    const zp = Math.min(1, Math.max(0, (t - i * D + T) / (D + T)));
    const s = (v.motion === 'zoom' ? 1 + ZOOM * zp : 1) * (o.scale || 1);
    ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
    ctx.drawImage(sl, (W - W * s) / 2 + (o.dx || 0), (H - H * s) / 2 + (o.dy || 0), W * s, H * s);
    ctx.globalAlpha = 1;
  };
  async function drawAt(ctx, t) {
    const i = Math.min(n - 1, Math.floor(t / D));
    const local = t - i * D;
    // 釋放用完的投影片、預先準備下一張
    for (const k of [...cache.keys()]) if (k < i) { cache.get(k).then(freeCanvas); cache.delete(k); }
    if (i + 1 < n) get(i + 1);
    const cur = await get(i);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (T > 0 && i + 1 < n && local > D - T) {
      const next = await get(i + 1);
      const fn = TRANSITIONS[pickTransition(v, i)] || TRANSITIONS.cross;
      fn(ctx, W, H, smooth((local - (D - T)) / T),
        (o) => drawSlide(ctx, cur, i, t, o), (o) => drawSlide(ctx, next, i + 1, t, o));
    } else drawSlide(ctx, cur, i, t, {});
    // 頭尾淡入淡出
    const edge = Math.min(1, t / EDGE_FADE, (total - t) / EDGE_FADE);
    if (edge < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - smooth(edge)})`; ctx.fillRect(0, 0, W, H); }
  }
  function release() { for (const pr of cache.values()) pr.then(freeCanvas); cache.clear(); }
  return { total, drawAt, release };
}
/** 做法 A：WebCodecs 編碼 H.264 + mp4-muxer 封裝（比即時快） */
async function encodeWebCodecs(W, H, tl, onProgress) {
  if (!window.Mp4Muxer) await loadScript(MP4MUXER_URL);
  let config = null;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42e028']) {
    const cfg = { codec, width: W, height: H, bitrate: VBITRATE, framerate: FPS, avc: { format: 'avc' } };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) { config = cfg; break; } } catch (e) { /* 試下一個 */ }
  }
  if (!config) throw new Error('此裝置不支援 H.264 編碼');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, fastStart: 'in-memory' });
  let encErr = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => { encErr = e; } });
  enc.configure(config);
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const frames = Math.round(tl.total * FPS);
  try {
    for (let f = 0; f < frames; f++) {
      if (encErr) throw encErr;
      if (videoCancel) throw new Error('CANCEL');
      await tl.drawAt(ctx, f / FPS);
      const vf = new VideoFrame(canvas, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame: f % (FPS * 2) === 0 });
      vf.close();
      while (enc.encodeQueueSize > 6) await sleep(4);
      if (f % 10 === 0) { onProgress(f / frames); await sleep(0); }
    }
    await enc.flush();
    if (encErr) throw encErr;
  } finally {
    if (enc.state !== 'closed') enc.close();
    freeCanvas(canvas);
  }
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}
/** 做法 B（備援）：邊播邊錄，影片多長就要等多久 */
async function encodeRecorder(W, H, tl, onProgress) {
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
  if (!mime) throw new Error('此瀏覽器無法錄製影片');
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  await tl.drawAt(ctx, 0);
  const stream = canvas.captureStream(FPS);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: VBITRATE });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((r) => { rec.onstop = r; });
  rec.start(1000);
  const t0 = performance.now();
  try {
    for (;;) {
      if (videoCancel) throw new Error('CANCEL');
      const t = (performance.now() - t0) / 1000;
      if (t >= tl.total) break;
      await tl.drawAt(ctx, t);
      onProgress(t / tl.total);
      await new Promise((r) => requestAnimationFrame(r));
    }
  } finally {
    rec.stop(); await stopped;
    stream.getTracks().forEach((tr) => tr.stop());
    freeCanvas(canvas);
  }
  return new Blob(chunks, { type: mime.split(';')[0] });
}
async function makeVideo() {
  const v = readVideoForm();
  saveVideoSettings(v);
  const [W, H] = VIDEO_SIZES[v.aspect];
  const tl = makeTimeline(v, pages.length, W, H);
  const prog = $('vProg'), bar = prog.firstElementChild;
  const onProgress = (r) => { bar.style.width = Math.round(r * 100) + '%'; $('vGo').textContent = `製作中 ${Math.round(r * 100)}%`; };
  videoBusy = true; videoCancel = false; refreshUI();
  $('vGo').disabled = true; $('vReset').disabled = true; prog.style.display = 'block'; $('vCancel').textContent = '停止';
  let wake = null;
  try { wake = await navigator.wakeLock?.request('screen'); } catch (e) { wake = null; }   // 製作中別讓螢幕關掉
  try {
    let blob;
    if (typeof VideoEncoder !== 'undefined' && typeof VideoFrame !== 'undefined') {
      try { blob = await encodeWebCodecs(W, H, tl, onProgress); }
      catch (e) { if (e.message === 'CANCEL') throw e; console.warn('WebCodecs 失敗，改用邊播邊錄', e); }
    }
    if (!blob) { toast('此裝置改用「邊播邊錄」，請保持螢幕開著', 3500); blob = await encodeRecorder(W, H, tl, onProgress); }
    onProgress(1);
    $('vdlg').classList.remove('show');
    showVideoResult(blob, tl.total);
  } catch (e) {
    if (e.message === 'CANCEL') toast('已停止');
    else { console.error(e); toast('影片製作失敗：' + (e && e.message ? e.message : e), 4000); }
  } finally {
    tl.release();
    try { wake && wake.release(); } catch (e) { /* 忽略 */ }
    videoBusy = false;
    $('vGo').disabled = false; $('vReset').disabled = false; $('vGo').textContent = '開始製作';
    prog.style.display = 'none'; bar.style.width = '0'; $('vCancel').textContent = '取消';
    refreshUI();
  }
}
function showVideoResult(blob, seconds) {
  const ext = /mp4/.test(blob.type) ? 'mp4' : 'webm';
  out = { mode: 'video', video: blob, ext };
  $('dlgTitle').textContent = '影片已完成';
  $('fnameLabel').textContent = '檔名';
  $('fname').value = stamp() + '.' + ext;
  $('dlgMeta').textContent = `${pages.length} 張 · ${Math.round(seconds)} 秒 · ${(blob.size / 1048576).toFixed(1)} MB · ${ext.toUpperCase()}`;
  const vid = $('dlgVideo');
  if (vid._url) URL.revokeObjectURL(vid._url);
  vid._url = URL.createObjectURL(blob); vid.src = vid._url; vid.style.display = 'block';
  vid.onloadedmetadata = () => { try { vid.currentTime = Math.min(1, vid.duration / 2); } catch (e) { /* 忽略 */ } };
  const canShare = !!(navigator.canShare && navigator.canShare({ files: outFiles() }));
  $('dlgShare').style.display = canShare ? '' : 'none';
  $('dlgShare').textContent = '分享／存到照片';
  $('dlgSave').textContent = '下載';
  $('dlgHint').textContent = canShare ? 'iPhone：按「分享／存到照片」，在選單中選「儲存影片」就會存進「照片」App。' : '';
  $('dlg').classList.add('show');
}
$('makeVid').onclick = () => { fillVideoForm(loadVideoSettings()); $('vdlg').classList.add('show'); };
$('vReset').onclick = () => fillVideoForm({ ...VIDEO_DEFAULTS });
$('vCancel').onclick = () => { if (videoBusy) videoCancel = true; else $('vdlg').classList.remove('show'); };
$('vGo').onclick = () => { if (!videoBusy && pages.length) makeVideo(); };

/* ---------------- 其他事件 ---------------- */
$('file').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
const drop = $('drop');
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
$('clearAll').onclick = () => {
  if (!pages.length || pages.some((p) => p.busy)) return;
  if (!confirm('確定清空所有頁面？')) return;
  pages.splice(0).forEach((p) => p.thumbUrl && URL.revokeObjectURL(p.thumbUrl));
  refreshUI();
};
$('verTop').textContent = 'v' + APP_VERSION;
$('verFoot').textContent = 'v' + APP_VERSION;
// 測試用掛勾
window.Photo2Media = { pages, buildPdf, detectQuad, orderQuad, cvReady };
refreshUI();
</script>
